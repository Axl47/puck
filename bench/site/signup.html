<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Signup · Lanternworks</title><link rel="stylesheet" href="/style.css"></head>
<body>
<nav><a href="/">Home</a><a href="/field-guide.html">Field Guide</a><a href="/inventory.html">Inventory</a><a href="/dispatches/">Dispatches</a><a href="/signup.html">Signup</a></nav>
<h1>Signup</h1>
<form id="signup">
<label for="name">Name</label><input id="name" name="name" required>
<label for="plan">Plan</label>
<select id="plan" name="plan"><option value="">Choose…</option><option>Solo</option><option>Team</option><option>Studio</option></select>
<p><button type="submit">Create account</button></p>
</form>
<p id="result" hidden>Confirmation code: <strong id="code"></strong></p>
<script type="module">
import { confirmationCode } from "/code.js";
document.getElementById("signup").addEventListener("submit", (event) => {
  event.preventDefault();
  const name = document.getElementById("name").value;
  const plan = document.getElementById("plan").value;
  if (!plan) return;
  document.getElementById("code").textContent = confirmationCode(name, plan);
  document.getElementById("result").hidden = false;
});
</script>
</body></html>
